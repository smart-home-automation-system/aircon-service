spring:
  application:
    name: aircon-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/aircon"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database.username}
    password: ${database.password}
    enabled: on
  # The one connection of the service (HAS-383): the virtual host of the notifications, where it publishes the alerts
  # of the availability monitor (NotificationPublisher of cholewa-commons) - the shape of appliance-service: it consumes
  # nothing, so no second connection and no copy of NotificationRabbitConfig. Confirms, returns and the mandatory flag
  # are what the publisher needs to know a notification reached a queue; it refuses to start without them
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: notification
    # no default on purpose: cholewa.required-properties refuses the start without it
    password: ${rabbitmq-password}
    virtual-host: /notification
    connection-timeout: 10s
    requested-heartbeat: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # defaults to false; without it the trace breaks at the broker
      observation-enabled: true

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  # no default on purpose: cholewa.required-properties refuses the start without it, before Flyway or
  # the pool try a password that is not one
  password: ${database-password}
  pool:
    # this service's share of the 47 connections of the managed database (heating 2 / database 4 /
    # water 2 / presence 2 / blinds 2 / weather 2 / light 2 / appliance 2 / energy 2 / aircon 2 - 22
    # allotted, with the 3 of ristretto 25 of 47, HAS-380). A rollout holds the pool twice and Flyway opens
    # one more connection
    max-size: 2

internal:
  service:
    # the device registry: the air conditioners of the house (the kind air conditioner, HAS-378)
    database: http://database-service:6200
    # the windows of the rooms (HAS-384): GET /home/heating/rooms, heating-service >= 1.20.0
    heating: http://heating-service:6200

aircon:
  # the local protocol of the Gree units (HAS-380): unicast UDP to the address of the registry - a broadcast from the
  # cluster does not reach the VLAN of the units. A datagram is lost now and then (Wi-Fi retransmissions of 11-62 %,
  # the probe of 2026-11-04), so every request waits timeout and is sent again up to retries times; a unit that fails
  # rebind-after requests in a row is bound again (a bare duration is seconds)
  gree:
    port: 7000
    timeout: PT3S
    retries: 2
    rebind-after: 3
  # the availability monitor (HAS-383): a unit that has not answered for offline-after is an alert on the technical
  # channel, named again every reminder-every while out, an info on its return
  monitor:
    offline-after: PT5M
    reminder-every: PT1H
  # an open window (HAS-384): a unit stopped by the window of its room is set back as it was when the window closes
  # within restore-within of the stop, later it stays off (a bare number is minutes)
  window:
    restore-within: PT1H
  # the commands (HAS-382): read back confirm-after later; the change a read shows within expect-for is the sender's, after
  # it the remote's (a bare duration is seconds)
  command:
    confirm-after: PT2S
    expect-for: PT60S

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: database.password
      variable: database-password
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
  notification:
    enabled: true
    env: prod

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8015 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

cholewa:
  notification:
    # a run outside the cluster publishes into the dev queue, never to the channel of the house
    env: dev

internal:
  service:
    database: http://localhost:6005
    heating: http://localhost:6002

server:
  port: 6015
management:
  server:
    port: 8015

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  # nothing listens here: a test that reaches the broker fails instead of publishing
  rabbitmq:
    host: localhost
    port: 1
    password: test

cholewa:
  notification:
    env: dev

# the pool opens nothing eagerly, and Flyway is off: a context test never reaches a database
database:
  password: test

# second line of defence: SchedulingConfig schedules nothing under this profile, and should a test call the
# registry all the same, it must not reach the one of the house
internal:
  service:
    database: http://localhost:1
    heating: http://localhost:1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
